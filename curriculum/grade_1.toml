# 1st grade: The Number Thief of Arithmos
#
# Reading level: short questions (about 10 words), numbers before words, a
# picture whenever possible. Levels: 1 = start of the year, 3 = standard,
# 5 = stretch. Never reorder or delete topics (hero codes); add at the end.

grade = "1"
name  = "1st grade"

# ---------------------------------------------------------------------------
[[region]]
key    = "village"
name   = "Sum Village"
gem    = "Gem of Sums"
topics = ["g1_add20", "g1_sub20", "g1_word", "g1_truefalse"]
task   = "coins"
task_topic  = "g1_add20"
task_levels = [1, 1]
intro  = "The market has lost its numbers! Nobody can add up the apples or count the change. Help the villagers add and take away."
outro  = "The Tally Troll stomps off. The Gem of Sums glows in your hand!"
  [[region.encounter]]
  slot  = 0
  intro = "My buns got mixed up! Help me add them up, please."
  [[region.encounter]]
  slot  = 1
  intro = "Some coins are gone. How many are left? Help me!"
  [[region.encounter]]
  slot  = 4
  intro = "A fisherman counts every fish. Is this sum true or false?"

[[region]]
key    = "mines"
name   = "Tens Mines"
gem    = "Gem of Tens"
topics = ["g1_place", "g1_compare", "g1_ten_more"]
intro  = "The miners pack their crystals in bundles of ten. Count the tens and the ones, and compare the piles!"
outro  = "The Crystal Golem crumbles. The Gem of Tens shines in the dark!"
  [[region.encounter]]
  slot  = 0
  intro = "Bundles of ten, and some loose ones. What number is that?"
  [[region.encounter]]
  slot  = 1
  intro = "Which cart has more crystals? Help me compare."
  [[region.encounter]]
  slot  = 4
  intro = "Ten more, ten less. Can you do it in your head?"

[[region]]
key    = "docks"
name   = "Measure Docks"
gem    = "Gem of Measures"
topics = ["g1_length", "g1_time"]
intro  = "At the docks the ropes have no lengths and the clocks have no times. Measure and tell the time to bring them back!"
outro  = "The Kraken sinks away. The Gem of Measures bobs up out of the water!"
  [[region.encounter]]
  slot  = 0
  intro = "Which rope is longest? Help me measure."
  [[region.encounter]]
  slot  = 1
  intro = "My boat leaves on the hour. What time is it?"
  [[region.encounter]]
  slot  = 4
  intro = "A good cook watches the clock. What time is it now?"

[[region]]
key    = "forest"
name   = "Graph Forest"
gem    = "Gem of Charts"
topics = ["g1_data"]
intro  = "The forest rangers count the animals and draw charts. But the charts lost their numbers! Read the tally marks and the pictures."
outro  = "The Piecemeal Wolf trots away. The Gem of Charts is yours!"
  [[region.encounter]]
  slot  = 0
  intro = "I counted my pies with tally marks. Read them for me!"
  [[region.encounter]]
  slot  = 1
  intro = "Whooo can read a chart? Show me, little hero."
  [[region.encounter]]
  slot  = 4
  intro = "Our fawns and rabbits are on this chart. Read it with me."

[[region]]
key    = "castle"
name   = "Shape Castle"
gem    = "Gem of Shapes"
topics = ["g1_halves"]
task   = "shade"
task_topic  = "g1_halves"
task_levels = [1, 1]
intro  = "The castle cooks cut every pie into equal parts. Halves, fourths... which is which? The builders need you!"
outro  = "The empty armor clatters down. The Gem of Shapes makes the castle whole again!"
  [[region.encounter]]
  slot  = 0
  intro = "I cut my pie into equal parts. What are they called?"
  [[region.encounter]]
  slot  = 1
  intro = "Which is bigger, a half or a fourth? Help me pick."
  [[region.encounter]]
  slot  = 4
  intro = "One last pie before the tower. How is it cut?"

[[region]]
key    = "peak"
name   = "Dragon's Peak"
gem    = "Gem of Wisdom"
topics = ["g1_add100"]
mix    = true
final  = true
