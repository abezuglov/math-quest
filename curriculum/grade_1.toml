[[topic]]
id       = "g1_data"
label    = "Tally and picture graphs"
standard = "1.MD.C.4"
tip      = "Each tally mark is one. A bundle with a line across is five. Count by fives, then by ones."

  [[topic.question]]
  vars    = { labels = "sample(['cats', 'dogs', 'fish', 'birds'], 2)", a = "randint(1, [5, 8, 10, 12, 12][L - 1])", b = "randint(1, [5, 8, 10, 12, 12][L - 1])" }
  where   = "a != b"
  text    = "How many {labels[0]}?"
  answer  = "a"
  hint    = "Count the tally marks next to {labels[0]}."
  explain = "There are {a} marks for {labels[0]}."
  picture = ["tally", "labels", "[a, b]"]

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  vars    = { labels = "sample(['cats', 'dogs', 'fish', 'birds'], 2)", a = "randint(2, [5, 8, 10, 12, 12][L - 1])", b = "randint(1, [5, 8, 10, 12, 12][L - 1])" }
  where   = "a > b"
  text    = "How many more {labels[0]} than {labels[1]}?"
  answer  = "a - b"
  hint    = "Count both. Then take the small one from the big one."
  explain = "{a} − {b} = {answer} more {labels[0]}."
  picture = ["tally", "labels", "[a, b]"]

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  vars    = { labels = "sample(['cats', 'dogs', 'fish', 'birds'], 2)", a = "randint(1, [5, 8, 10, 12, 12][L - 1])", b = "randint(1, [5, 8, 10, 12, 12][L - 1])" }
  text    = "How many {labels[0]} and {labels[1]} in all?"
  answer  = "a + b"
  hint    = "Count both rows. Then add."
  explain = "{a} + {b} = {answer} in all."
  picture = ["tally", "labels", "[a, b]"]

  [[topic.question]]
  levels  = [3, 4, 5]
  kind    = "choice"
  vars    = { labels = "sample(['cats', 'dogs', 'fish', 'birds'], 3)", cs = "sample(range(1, 11), 3)" }
  text    = "Which has the most?"
  answer  = "labels[index(cs, max(cs))]"
  choices = ["labels[0]", "labels[1]", "labels[2]"]
  shuffle = false
  hint    = "The longest row of stars wins."
  explain = "{answer} has {max(cs)} stars, the most."
  picture = ["picture_graph", "labels", "cs", "1"]

  [[topic.question]]
  levels  = [4, 5]
  vars    = { labels = "sample(['cats', 'dogs', 'fish', 'birds'], 2)", a = "2 * randint(1, 6)", b = "2 * randint(1, 6)" }
  where   = "a != b"
  text    = "Each star is 2. How many {labels[0]}?"
  answer  = "a"
  hint    = "Count the stars by twos."
  explain = "{a // 2} stars, and each is 2: {answer}."
  picture = ["picture_graph", "labels", "[a, b]", "2"]

  [[topic.question]]
  levels  = [4, 5]
  vars    = { labels = "sample(['cats', 'dogs', 'fish', 'birds'], 2)", a = "randint(2, 12)", b = "randint(1, 11)" }
  where   = "a > b"
  text    = "How many fewer {labels[1]} than {labels[0]}?"
  answer  = "a - b"
  hint    = "Count both. Then take the small one from the big one."
  explain = "{a} − {b} = {answer} fewer {labels[1]}."
  picture = ["tally", "labels", "[a, b]"]

[[topic]]
id       = "g1_halves"
label    = "Halves and fourths"
standard = "1.G.A.3"
tip      = "Halves are 2 equal parts. Fourths are 4 equal parts. Equal means the same size."

  [[topic.question]]
  kind    = "choice"
  vars    = { n = "choice([2, 4])" }
  text    = "This shape has {n} equal parts. What are they called?"
  answer  = "'halves' if n == 2 else 'fourths'"
  choices = ["'halves'", "'fourths'"]
  shuffle = false
  hint    = "2 parts are halves. 4 parts are fourths."
  explain = "{n} equal parts are {answer}."
  picture = ["parts", "n", "0"]

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  kind    = "choice"
  vars    = { n = "choice([2, 4])" }
  text    = "One part is colored. What part is it?"
  answer  = "'one half' if n == 2 else 'one fourth'"
  choices = ["'one half'", "'one fourth'"]
  shuffle = false
  hint    = "Count the parts first."
  explain = "1 of {n} equal parts is {answer}."
  picture = ["parts", "n", "1"]

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  vars    = { n = "choice([2, 4])", w = "'halves' if n == 2 else 'fourths'", thing = "choice(['A pizza', 'A pie', 'A sandwich', 'A cake'])" }
  text    = "{thing} is cut in {w}. How many pieces?"
  answer  = "n"
  hint    = "Halves: 2. Fourths: 4."
  explain = "{w} means {answer} equal pieces."

  [[topic.question]]
  levels  = [3, 4, 5]
  kind    = "choice"
  vars    = { p = "shuffled(['one half', 'one fourth'])" }
  text    = "Same pie. Which piece is bigger: {p[0]} or {p[1]}?"
  answer  = "'one half'"
  choices = ["p[0]", "p[1]"]
  shuffle = false
  hint    = "Fewer parts means bigger parts."
  explain = "Cutting into 2 makes bigger pieces than cutting into 4. One half is bigger."

  [[topic.question]]
  levels  = [4, 5]
  vars    = { n = "choice([2, 4])", w = "'halves' if n == 2 else 'fourths'" }
  text    = "How many {w} make one whole?"
  answer  = "n"
  hint    = "Count the equal parts in the whole."
  explain = "{answer} {w} make one whole."
  picture = ["parts", "n", "n"]

[[topic]]
id       = "g1_add100"
label    = "Adding within 100"
standard = "1.NBT.C.4"
tip      = "Add the tens, then the ones. Tens go with tens, ones go with ones."

  [[topic.question]]
  vars    = { a = "randint(10, [40, 60, 89, 89, 89][L - 1])", b = "randint(1, 9)" }
  where   = "a + b <= 99 and (L >= 3 or a % 10 + b < 10)"
  text    = "{a} + {b} = ?"
  answer  = "a + b"
  hint    = "Add {b} to the ones: {a % 10} + {b}."
  explain = "{a} + {b} = {answer}."

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  vars    = { a = "randint(10, [40, 60, 69, 89, 89][L - 1])", b = "randstep(10, [30, 30, 30, 50, 50][L - 1], 10)" }
  where   = "a + b <= 99"
  text    = "{a} + {b} = ?"
  answer  = "a + b"
  hint    = "Add the tens: {a // 10} tens + {b // 10} tens."
  explain = "{a} + {b} = {answer}. The ones stay {a % 10}."

  [[topic.question]]
  levels  = [3, 4, 5]
  vars    = { a = "randint(10, 89)", b = "choice([randint(1, 9), randstep(10, 50, 10)])", who = "name()", what = "item()" }
  where   = "a + b <= 99"
  text    = "{who} has {a} {what}. Gets {b} more. How many now?"
  answer  = "a + b"
  hint    = "Tens with tens, ones with ones."
  explain = "{a} + {b} = {answer} {what}."

  [[topic.question]]
  levels  = [4, 5]
  vars    = { a = "randint(11, 59)", b = "randint(11, 39)" }
  where   = "a % 10 + b % 10 < 10 and a + b <= 99"
  text    = "{a} + {b} = ?"
  answer  = "a + b"
  hint    = "Tens: {a // 10} + {b // 10}. Ones: {a % 10} + {b % 10}."
  explain = "{10 * (a // 10)} + {10 * (b // 10)} = {10 * (a // 10 + b // 10)}, and {a % 10} + {b % 10} = {a % 10 + b % 10}. Total {answer}."

  [[topic.question]]
  levels  = [5]
  vars    = { a = "randint(11, 59)", b = "randint(11, 39)" }
  where   = "a % 10 + b % 10 >= 10 and a + b <= 99"
  text    = "{a} + {b} = ?"
  answer  = "a + b"
  hint    = "The ones make more than 10. That makes a new ten."
  explain = "{a % 10} + {b % 10} = {a % 10 + b % 10}: that is a ten and {(a % 10 + b % 10) % 10}. So {a} + {b} = {answer}."
