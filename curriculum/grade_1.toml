task_topic  = "g1_add100"
task_levels = [1, 2]
intro  = "The path climbs into the clouds. Up here the numbers are big, and Zerix will test everything you have learned."
  [[region.encounter]]
  slot  = 0
  intro = "Up here the numbers go past 20. Add the tens, then the ones."
  [[region.encounter]]
  slot  = 6
  intro = "This is the page from the year we were sent away. One line is added wrong. Hero, can you find it?"

# ---------------------------------------------------------------------------
[[topic]]
id       = "g1_add20"
label    = "Adding within 20"
standard = "1.OA.C.6"
tip      = "Start with the bigger number and count on. Or make a ten first: 8 + 5 is 8 + 2 + 3."

  [[topic.question]]
  vars    = { a = "randint(1, 9)", b = "randint(1, 9)" }
  where   = "a + b <= [10, 12, 20, 20, 20][L - 1]"
  text    = "{a} + {b} = ?"
  answer  = "a + b"
  hint    = "Start at {max(a, b)}. Count on {min(a, b)}."
  explain = "{a} + {b} = {answer}."
  picture = ["dots", "a + b"]

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  vars    = { a = "randint(2, [5, 6, 9, 9, 9][L - 1])" }
  text    = "Double {a}. What is {a} + {a}?"
  answer  = "2 * a"
  hint    = "{a} and {a} more."
  explain = "{a} + {a} = {answer}."
  picture = ["dots", "2 * a"]

  [[topic.question]]
  levels  = [3, 4, 5]
  vars    = { a = "randint(5, 9)", b = "randint(2, 9)" }
  where   = "a + b > 10 and a + b <= 18"
  text    = "{a} + {b} = ?"
  answer  = "a + b"
  hint    = "Make 10 first: {a} + {10 - a} = 10. Then add {b - (10 - a)} more."
  explain = "{a} + {10 - a} = 10, and 10 + {a + b - 10} = {answer}."

  [[topic.question]]
  levels  = [3, 4, 5]
  vars    = { t = "randint(8, [10, 10, 15, 20, 20][L - 1])", a = "randint(1, t - 1)" }
  text    = "{a} + ? = {t}"
  answer  = "t - a"
  hint    = "Count up from {a} to {t}."
  explain = "{a} + {answer} = {t}."

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  vars    = { a = "randint(2, 9)", b = "randint(1, 9)", who = "name()", what = "item()" }
  where   = "a + b <= [10, 12, 20, 20, 20][L - 1]"
  text    = "{who} has {a} {what}. Gets {b} more. How many now?"
  answer  = "a + b"
  hint    = "Put them together: {a} and {b} more."
  explain = "{a} + {b} = {answer} {what}."
  picture = ["dots", "a + b"]

  [[topic.question]]
  levels  = [4, 5]
  vars    = { a = "randint(1, 9)", b = "randint(1, 9)", c = "randint(1, 9)" }
  where   = "a + b + c <= 20"
  text    = "{a} + {b} + {c} = ?"
  answer  = "a + b + c"
  hint    = "Add two numbers first: {a} + {b} = {a + b}. Then add {c}."
  explain = "{a} + {b} = {a + b}, and {a + b} + {c} = {answer}."

[[topic]]
id       = "g1_sub20"
label    = "Subtracting within 20"
standard = "1.OA.C.6"
tip      = "Think of adding: what number goes with the small number to make the big one?"

  [[topic.question]]
  vars    = { a = "randint(2, [10, 12, 20, 20, 20][L - 1])", b = "randint(1, 9)" }
  where   = "b < a"
  text    = "{a} − {b} = ?"
  answer  = "a - b"
  hint    = "Count back {b} from {a}."
  explain = "{a} − {b} = {answer}."
  picture = ["dots", "a"]

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  vars    = { a = "randint(3, [10, 12, 20, 20, 20][L - 1])", b = "randint(1, 9)", who = "name()", what = "item()" }
  where   = "b < a"
  text    = "{who} has {a} {what}. Gives {b} away. How many left?"
  answer  = "a - b"
  hint    = "Take {b} away from {a}."
  explain = "{a} − {b} = {answer} {what} left."
  picture = ["dots", "a"]

  [[topic.question]]
  levels  = [3, 4, 5]
  vars    = { a = "randint(5, 20)", b = "randint(1, 9)" }
  where   = "b < a"
  text    = "{a} − ? = {a - b}"
  answer  = "b"
  hint    = "Count up from {a - b} to {a}."
  explain = "{a} − {answer} = {a - b}."

  [[topic.question]]
  levels  = [3, 4, 5]
  vars    = { a = "randint(5, 20)", b = "randint(1, 19)", ns = "names(2)" }
  where   = "a > b"
  text    = "{ns[0]} has {a} shells. {ns[1]} has {b}. How many more?"
  answer  = "a - b"
  hint    = "Count up from {b} to {a}."
  explain = "{a} − {b} = {answer}. {ns[0]} has {answer} more."

  [[topic.question]]
  levels  = [4, 5]
  vars    = { b = "randint(1, 9)", c = "randint(1, 11)" }
  text    = "? − {b} = {c}"
  answer  = "b + c"
  hint    = "Add back: {c} + {b}."
  explain = "{c} + {b} = {answer}, so {answer} − {b} = {c}."

[[topic]]
id       = "g1_word"
label    = "Story problems"
standard = "1.OA.A.1"
tip      = "Draw the story: what is there at the start, what changes, what is at the end? The missing part is the answer."

  [[topic.question]]
  vars    = { a = "randint(2, 9)", b = "randint(1, 9)", who = "name()", what = "item()" }
  where   = "a + b <= [10, 12, 20, 20, 20][L - 1]"
  text    = "{who} had {a} {what}. Found {b} more. How many now?"
  answer  = "a + b"
  hint    = "Start at {a}. Count on {b}."
  explain = "{a} + {b} = {answer}."
  picture = ["dots", "a + b"]

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  vars    = { a = "randint(1, 9)", c = "randint(3, [10, 12, 20, 20, 20][L - 1])", who = "name()", what = "item()" }
  where   = "c > a"
  text    = "{who} had {a} {what}. Now has {c}. How many more?"
  answer  = "c - a"
  hint    = "Count up from {a} to {c}."
  explain = "{a} + {answer} = {c}, so {who} got {answer} more."

  [[topic.question]]
  levels  = [3, 4, 5]
  vars    = { b = "randint(1, 9)", c = "randint(3, 20)", who = "name()", what = "item()" }
  where   = "c > b"
  text    = "{who} got {b} {what}. Now has {c}. How many at first?"
  answer  = "c - b"
  hint    = "Take the {b} new ones away from {c}."
  explain = "{c} − {b} = {answer}. {who} had {answer} at first."

  [[topic.question]]
  levels  = [3, 4, 5]
  vars    = { a = "randint(4, 20)", c = "randint(1, 19)", who = "name()", what = "item()" }
  where   = "a > c"
  text    = "{who} had {a} {what}. Gave some away. {c} left. How many given?"
  answer  = "a - c"
  hint    = "How far is it from {c} up to {a}?"
  explain = "{a} − {c} = {answer} were given away."

  [[topic.question]]
  levels  = [4, 5]
  vars    = { b = "randint(1, 9)", c = "randint(1, 11)", who = "name()", what = "item()" }
  text    = "{who} gave away {b} {what}. {c} are left. How many at first?"
  answer  = "b + c"
  hint    = "Put the given ones and the left ones back together."
  explain = "{b} + {c} = {answer} at first."

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  vars    = { a = "randint(2, [10, 12, 20, 20, 20][L - 1])", b = "randint(1, 19)", ns = "names(2)" }
  where   = "a > b"
  text    = "{ns[0]} has {a}. {ns[1]} has {b}. How many fewer does {ns[1]} have?"
  answer  = "a - b"
  hint    = "Count up from {b} to {a}."
  explain = "{a} − {b} = {answer} fewer."

[[topic]]
id       = "g1_truefalse"
label    = "True or false"
standard = "1.OA.D.7"
tip      = "Work out each side of the = sign. True means both sides are the same number."

  [[topic.question]]
  kind    = "choice"
  vars    = { a = "randint(1, [5, 7, 9, 9, 9][L - 1])", b = "randint(1, [5, 7, 9, 9, 9][L - 1])", ok = "coin()", c = "a + b if ok else a + b + choice([-1, 1, 2])" }
  text    = "True or false: {a} + {b} = {c}"
  answer  = "'True' if ok else 'False'"
  choices = ["'True'", "'False'"]
  shuffle = false
  hint    = "Work out {a} + {b} first."
  explain = "{a} + {b} = {a + b}, so it is {answer}."

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  kind    = "choice"
  vars    = { a = "randint(1, 9)", b = "randint(1, 9)", ok = "coin()", c = "a + b if ok else a + b + choice([-1, 1, 2])" }
  text    = "True or false: {c} = {a} + {b}"
  answer  = "'True' if ok else 'False'"
  choices = ["'True'", "'False'"]
  shuffle = false
  hint    = "The = sign means both sides are the same."
  explain = "{a} + {b} = {a + b}, so it is {answer}."

  [[topic.question]]
  levels  = [3, 4, 5]
  kind    = "choice"
  vars    = { a = "randint(3, 12)", b = "randint(1, 9)", ok = "coin()", c = "a - b if ok else a - b + choice([-1, 1])" }
  where   = "a > b and c >= 0"
  text    = "True or false: {a} − {b} = {c}"
  answer  = "'True' if ok else 'False'"
  choices = ["'True'", "'False'"]
  shuffle = false
  hint    = "Work out {a} − {b} first."
  explain = "{a} − {b} = {a - b}, so it is {answer}."

  [[topic.question]]
  levels  = [3, 4, 5]
  kind    = "choice"
  vars    = { a = "randint(1, 9)", b = "randint(1, 9)", c = "randint(1, 9)", ok = "coin()", d = "a + b - c + (0 if ok else choice([-1, 1, 2]))" }
  where   = "a + b - c >= 0 and d >= 0"
  text    = "True or false: {a} + {b} = {c} + {d}"
  answer  = "'True' if ok else 'False'"
  choices = ["'True'", "'False'"]
  shuffle = false
  hint    = "Work out both sides. Are they the same?"
  explain = "{a} + {b} = {a + b} and {c} + {d} = {c + d}, so it is {answer}."

  [[topic.question]]
  levels  = [4, 5]
  kind    = "choice"
  vars    = { a = "randint(2, 12)", b = "randint(0, 9)", ok = "coin()", c = "a - b if ok else a - b + choice([-1, 1])" }
  where   = "a - b >= 0 and c >= 0"
  text    = "True or false: {a} = {b} + {c}"
  answer  = "'True' if ok else 'False'"
  choices = ["'True'", "'False'"]
  shuffle = false
  hint    = "Work out {b} + {c}. Is it {a}?"
  explain = "{b} + {c} = {b + c}, so it is {answer}."

[[topic]]
id       = "g1_place"
label    = "Tens and ones"
standard = "1.NBT.B.2"
tip      = "A number like 47 is 4 tens and 7 ones. Ten ones make one ten."

  [[topic.question]]
  vars    = { t = "randint(1, [5, 9, 9, 11, 11][L - 1])", o = "randint(0, 9)" }
  text    = "{t} tens and {o} ones. What number?"
  answer  = "10 * t + o"
  hint    = "{t} tens is {10 * t}. Then add the ones."
  explain = "{10 * t} + {o} = {answer}."

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  vars    = { n = "randint(11, [50, 99, 99, 120, 120][L - 1])" }
  text    = "How many tens are in {n}?"
  answer  = "n // 10"
  hint    = "Count by tens up to {n}."
  explain = "{n} is {answer} tens and {n % 10} ones."

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  vars    = { n = "randint(10, 99)" }
  text    = "What digit is in the ones place of {n}?"
  answer  = "n % 10"
  hint    = "The ones digit is the last one."
  explain = "{n} is {n // 10} tens and {answer} ones."

  [[topic.question]]
  levels  = [3, 4, 5]
  vars    = { n = "randint(10, 99)" }
  text    = "{n} = ? tens and {n % 10} ones"
  answer  = "n // 10"
  hint    = "The tens digit is the first one."
  explain = "{n} = {answer} tens and {n % 10} ones."

  [[topic.question]]
  levels  = [4, 5]
  vars    = { t = "randint(2, 12)" }
  text    = "{t} tens = ?"
  answer  = "10 * t"
  hint    = "Count by tens {t} times."
  explain = "{t} tens = {answer}."

[[topic]]
id       = "g1_compare"
label    = "Comparing numbers"
standard = "1.NBT.B.3"
tip      = "Look at the tens first. More tens means a bigger number. Same tens? Then look at the ones."

  [[topic.question]]
  kind    = "choice"
  vars    = { a = "randint(10, [30, 50, 99, 99, 120][L - 1])", b = "randint(10, [30, 50, 99, 99, 120][L - 1])" }
  text    = "{a} ? {b}   Which sign goes in the middle?"
  answer  = "compare(a, b)"
  choices = ["'<'", "'>'", "'='"]
  shuffle = false
  hint    = "Which number has more tens?"
  explain = "{a} {answer} {b}."

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  kind    = "choice"
  vars    = { a = "randint(10, [30, 50, 99, 99, 120][L - 1])", b = "randint(10, [30, 50, 99, 99, 120][L - 1])" }
  where   = "a != b"
  text    = "Which is bigger: {a} or {b}?"
  answer  = "max(a, b)"
  choices = ["a", "b"]
  shuffle = false
  hint    = "Compare the tens first."
  explain = "{max(a, b)} is bigger than {min(a, b)}."

  [[topic.question]]
  levels  = [3, 4, 5]
  kind    = "choice"
  vars    = { a = "randint(10, 99)", b = "randint(10, 99)", c = "randint(10, 99)" }
  where   = "different(a, b, c)"
  text    = "Which is smallest: {a}, {b}, or {c}?"
  answer  = "min(a, b, c)"
  choices = ["a", "b", "c"]
  shuffle = false
  hint    = "The fewest tens wins."
  explain = "{answer} is the smallest."

  [[topic.question]]
  levels  = [4, 5]
  kind    = "choice"
  vars    = { a = "randint(10, 120)", b = "randint(10, 120)" }
  text    = "Is {a} less than {b}?"
  answer  = "yesno(a < b)"
  choices = ["'Yes'", "'No'"]
  shuffle = false
  hint    = "Less than means smaller."
  explain = "{a} {compare(a, b)} {b}, so the answer is {answer}."

[[topic]]
id       = "g1_ten_more"
label    = "10 more, 10 less"
standard = "1.NBT.C.5"
tip      = "10 more changes the tens digit by one. The ones digit stays the same."

  [[topic.question]]
  vars    = { n = "randint(1, [50, 80, 89, 109, 109][L - 1])" }
  text    = "What is 10 more than {n}?"
  answer  = "n + 10"
  hint    = "Add one ten. The ones stay the same."
  explain = "{n} + 10 = {answer}."

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  vars    = { n = "randint(11, [60, 90, 99, 120, 120][L - 1])" }
  text    = "What is 10 less than {n}?"
  answer  = "n - 10"
  hint    = "Take away one ten. The ones stay the same."
  explain = "{n} − 10 = {answer}."

  [[topic.question]]
  levels  = [3, 4, 5]
  vars    = { n = "randint(1, 90)" }
  text    = "Count by tens: {n}, {n + 10}, {n + 20}, ?"
  answer  = "n + 30"
  hint    = "Add 10 to {n + 20}."
  explain = "{n + 20} + 10 = {answer}."

  [[topic.question]]
  levels  = [4, 5]
  vars    = { n = "randint(1, 99)" }
  text    = "{n} + 10 + 10 = ?"
  answer  = "n + 20"
  hint    = "Add one ten, then one more ten."
  explain = "{n} + 10 = {n + 10}, and {n + 10} + 10 = {answer}."

[[topic]]
id       = "g1_length"
label    = "Comparing lengths"
standard = "1.MD.A.1"
tip      = "Line things up at one end. The one that sticks out is longer."

  [[topic.question]]
  kind    = "choice"
  vars    = { things = "sample(['pencil', 'crayon', 'straw', 'ribbon', 'stick', 'spoon'], 3)", ls = "sample(range(2, 4 + 2 * L), 3)" }
  text    = "{things[0]}: {ls[0]} cubes. {things[1]}: {ls[1]} cubes. {things[2]}: {ls[2]} cubes. Longest?"
  answer  = "things[index(ls, max(ls))]"
  choices = ["things[0]", "things[1]", "things[2]"]
  shuffle = false
  hint    = "The most cubes is the longest."
  explain = "{max(ls)} cubes is the most, so the {answer} is longest."

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  kind    = "choice"
  vars    = { things = "sample(['pencil', 'crayon', 'straw', 'ribbon', 'stick', 'spoon'], 3)", ls = "sample(range(2, 4 + 2 * L), 3)" }
  text    = "{things[0]}: {ls[0]} cubes. {things[1]}: {ls[1]} cubes. {things[2]}: {ls[2]} cubes. Shortest?"
  answer  = "things[index(ls, min(ls))]"
  choices = ["things[0]", "things[1]", "things[2]"]
  shuffle = false
  hint    = "The fewest cubes is the shortest."
  explain = "{min(ls)} cubes is the fewest, so the {answer} is shortest."

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  vars    = { things = "sample(['pencil', 'crayon', 'straw', 'ribbon', 'stick', 'spoon'], 2)", a = "randint(2, 4 + 2 * L)", b = "randint(1, 4 + 2 * L)" }
  where   = "a > b"
  text    = "{things[0]}: {a} cubes. {things[1]}: {b} cubes. How many cubes longer?"
  answer  = "a - b"
  hint    = "Count up from {b} to {a}."
  explain = "{a} − {b} = {answer} cubes longer."

  [[topic.question]]
  levels  = [4, 5]
  kind    = "choice"
  vars    = { things = "sample(['pencil', 'crayon', 'straw', 'ribbon', 'stick', 'spoon'], 3)", ls = "sample(range(2, 15), 3)" }
  text    = "{things[0]}: {ls[0]} cubes. {things[1]}: {ls[1]}. {things[2]}: {ls[2]}. Which is in the middle?"
  answer  = "things[index(ls, sorted(ls)[1])]"
  choices = ["things[0]", "things[1]", "things[2]"]
  shuffle = false
  hint    = "Not the longest, not the shortest."
  explain = "{sorted(ls)[0]} < {sorted(ls)[1]} < {sorted(ls)[2]}, so the {answer} is in the middle."

[[topic]]
id       = "g1_time"
label    = "Telling time"
standard = "1.MD.B.3"
tip      = "The short hand tells the hour. The long hand on 12 means o'clock; on 6 it means half past."

  [[topic.question]]
  kind    = "choice"
