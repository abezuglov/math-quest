# 4th grade: The Number Thief of Arithmos
#
# The seven topics below are the original hand-written generators from
# questions.py ("generator = ..."). Their ids and ORDER must never change:
# old hero codes depend on them. New topics may only be added at the END.
# A teacher who wants a topic out of the game sets `enabled = false`.

grade = "4"
name  = "4th grade"
title = "The Number Thief of Arithmos"

# ---------------------------------------------------------------------------
# Regions (map spots), in the order they appear on the map.
# ---------------------------------------------------------------------------
[[region]]
key    = "village"
name   = "Market Village"
gem    = "Gem of Sums"
topics = ["addition", "subtraction", "g4_place"]
task   = "coins"
task_topic = "addition"

[[region]]
key    = "mines"
name   = "Multiplication Mines"
gem    = "Gem of Times"
topics = ["multiplication", "g4_factors"]
task   = "multiples"
task_topic = "multiplication"
  [[region.encounter]]
  slot  = 1
  intro = "I need to know how many lamps to light. Help me multiply."

[[region]]
key    = "docks"
name   = "Division Docks"
gem    = "Gem of Shares"
topics = ["division", "g4_convert"]
task   = "share"
task_topic = "division"
  [[region.encounter]]
  slot  = 0
  intro = "My crew wants equal shares, and I've lost my numbers. Help me, sailor!"
  [[region.encounter]]
  slot  = 1
  intro = "I've got fish to split between the boats. How many each?"
  [[region.encounter]]
  slot  = 4
  intro = "A good cook wastes nothing. Tell me about the shares and the leftovers."

[[region]]
key    = "forest"
name   = "Fraction Forest"
gem    = "Gem of Parts"
topics = ["fractions", "g4_decimals"]
task   = "shade"
task_topic = "fractions"
  [[region.encounter]]
  slot  = 0
  intro = "I can't slice my pies fairly anymore! Help me with the pieces."
  [[region.encounter]]
  slot  = 1
  intro = "Whooo knows their fractions? Show me, little hero."

[[region]]
key    = "castle"
name   = "Castle Builders"
gem    = "Gem of Measures"
topics = ["area_perimeter", "g4_angles", "g4_lines"]
task   = "garden"
task_topic = "area_perimeter"

[[region]]
key    = "peak"
name   = "Dragon's Peak"
gem    = "Gem of Wisdom"
topics = ["two_step"]
mix    = true
final  = true
task   = "ledger"
task_topic = "two_step"
  [[region.encounter]]
  slot  = 0
  intro = "Up here, one step is never enough. Take two. Think slowly."

