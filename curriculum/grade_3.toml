# ---------------------------------------------------------------------------
[[topic]]
id       = "g3_add1000"
label    = "Adding and subtracting within 1000"
standard = "3.NBT.A.2"
tip      = "Line up the places. Add ones, then tens, then hundreds, carrying when a column makes 10 or more."

  [[topic.question]]
  vars    = { a = "randint(100, [400, 600, 899, 899, 899][L - 1])", b = "randint(100, [300, 400, 899, 899, 899][L - 1])" }
  where   = "a + b <= 999 and (L >= 2 or digit(a, 1) + digit(b, 1) < 10)"
  text    = "{a} + {b} = ?"
  answer  = "a + b"
  hint    = "Ones, then tens, then hundreds."
  explain = "{a} + {b} = {answer}."

  [[topic.question]]
  vars    = { a = "randint(200, 999)", b = "randint(100, 899)" }
  where   = "b < a and (L >= 2 or digit(a, 1) >= digit(b, 1))"
  text    = "{a} − {b} = ?"
  answer  = "a - b"
  hint    = "Ones, then tens, then hundreds. Borrow when a digit is too small."
  explain = "{a} − {b} = {answer}."

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  vars    = { a = "randint(100, 700)", b = "randint(100, 500)", ns = "names(2)" }
  where   = "a + b <= 999"
  text    = "{ns[0]} collected {a} cans and {ns[1]} collected {b}. How many cans together?"
  answer  = "a + b"
  hint    = "Add the hundreds, tens and ones."
  explain = "{a} + {b} = {answer} cans."

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  vars    = { a = "randint(300, 999)", b = "randint(100, 800)", ns = "names(2)" }
  where   = "a > b"
  text    = "{ns[0]} has {a} stamps. {ns[1]} has {b}. How many more does {ns[0]} have?"
  answer  = "a - b"
  hint    = "Find the difference: {a} − {b}."
  explain = "{a} − {b} = {answer} more."

  [[topic.question]]
  levels  = [3, 4, 5]
  vars    = { t = "randint(300, 999)", a = "randint(100, t - 1)" }
  text    = "{a} + ? = {t}"
  answer  = "t - a"
  hint    = "Subtract: {t} − {a}."
  explain = "{a} + {answer} = {t}."

  [[topic.question]]
  levels  = [4, 5]
  vars    = { a = "randint(300, 999)", c = "randint(1, 299)" }
  text    = "{a} − ? = {c}"
  answer  = "a - c"
  hint    = "Subtract: {a} − {c}."
  explain = "{a} − {answer} = {c}."

  [[topic.question]]
  levels  = [4, 5]
  vars    = { a = "randint(100, 400)", b = "randint(100, 300)", c = "randint(10, 299)" }
  where   = "a + b + c <= 999"
  text    = "{a} + {b} + {c} = ?"
  answer  = "a + b + c"
  hint    = "Add two numbers first, then the third."
  explain = "{a} + {b} = {a + b}, and {a + b} + {c} = {answer}."

[[topic]]
id       = "g3_round"
label    = "Rounding"
standard = "3.NBT.A.1"
tip      = "Look at the digit just to the right of the place you round to. 5 or more rounds up, 4 or less rounds down."

  [[topic.question]]
  vars    = { n = "randint(11, [99, 99, 999, 999, 999][L - 1])" }
  where   = "n % 10 != 0 and (L >= 3 or n % 10 != 5)"
  text    = "Round {n} to the nearest ten."
  answer  = "round_to(n, 10)"
  hint    = "Is {n} closer to {n - n % 10} or to {n - n % 10 + 10}?"
  explain = "{n} is between {n - n % 10} and {n - n % 10 + 10}. The ones digit is {n % 10}, so it rounds to {answer}."

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  vars    = { n = "randint(101, 999)" }
  where   = "n % 100 != 0"
  text    = "Round {n} to the nearest hundred."
  answer  = "round_to(n, 100)"
  hint    = "Look at the tens digit: {digit(n, 10)}."
  explain = "{n} is between {n - n % 100} and {n - n % 100 + 100}. The tens digit is {digit(n, 10)}, so it rounds to {answer}."

  [[topic.question]]
  levels  = [3, 4, 5]
  vars    = { n = "randint(101, 999)", what = "choice(['marbles', 'beads', 'stickers', 'seeds'])" }
  where   = "n % 10 != 0"
  text    = "A jar holds {n} {what}. About how many is that, to the nearest ten?"
  answer  = "round_to(n, 10)"
  hint    = "Look at the ones digit: {n % 10}."
  explain = "{n} rounds to {answer}."

  [[topic.question]]
  levels  = [3, 4, 5]
  kind    = "choice"
  vars    = { r = "randstep(20, 990, 10)", c1 = "r + choice([-4, -3, -2, -1, 1, 2, 3, 4])", c2 = "r + choice([6, 7, 8, 9])", c3 = "r - choice([6, 7, 8, 9])" }
  text    = "Which number rounds to {r} (nearest ten)?"
  answer  = "c1"
  choices = ["c1", "c2", "c3"]
  hint    = "The number must be less than 5 away from {r}."
  explain = "{c1} rounds to {r}. {c2} rounds to {round_to(c2, 10)} and {c3} rounds to {round_to(c3, 10)}."

  [[topic.question]]
  levels  = [4, 5]
  vars    = { a = "randint(101, 499)", b = "randint(101, 499)" }
  where   = "a % 100 != 0 and b % 100 != 0"
  text    = "Estimate {a} + {b} by rounding each number to the nearest hundred."
  answer  = "round_to(a, 100) + round_to(b, 100)"
  hint    = "{a} rounds to {round_to(a, 100)}. {b} rounds to {round_to(b, 100)}."
  explain = "{round_to(a, 100)} + {round_to(b, 100)} = {answer}."

  [[topic.question]]
  levels  = [5]
  vars    = { r = "randstep(20, 990, 10)" }
  text    = "What is the smallest whole number that rounds to {r} (nearest ten)?"
  answer  = "r - 5"
  hint    = "A 5 in the ones place rounds up."
  explain = "{r - 5} rounds up to {r}, and {r - 6} rounds down to {r - 10}."

[[topic]]
id       = "g3_mult"
label    = "Multiplication facts"
standard = "3.OA.C.7"
tip      = "Skip count, or use a fact you know: 6 × 7 is 5 × 7 plus one more 7."

  [[topic.question]]
  levels  = [1, 2]
  vars    = { a = "randint(2, [5, 6][L - 1])", b = "randint(2, [5, 9][L - 1])" }
  text    = "{a} × {b} = ?"
  answer  = "a * b"
  hint    = "{a} rows of {b}. Count the dots, or add {b} {a} times."
  explain = "{a} × {b} = {answer}."
  picture = ["array", "a", "b"]

  [[topic.question]]
  levels  = [3, 4, 5]
  vars    = { a = "randint(2, [9, 9, 9, 10, 12][L - 1])", b = "randint(2, [9, 9, 9, 10, 12][L - 1])" }
  text    = "{a} × {b} = ?"
  answer  = "a * b"
  hint    = "Count by {b}s, {a} times."
  explain = "{a} × {b} = {answer}."

  [[topic.question]]
  levels  = [1, 2, 3]
  vars    = { g = "randint(2, [4, 5, 5][L - 1])", n = "randint(2, [5, 6, 6][L - 1])", what = "item()" }
  text    = "{g} bags with {n} {what} in each. How many {what} in all?"
  answer  = "g * n"
  hint    = "{g} groups of {n}."
  explain = "{g} × {n} = {answer}."
  picture = ["array", "g", "n"]

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  vars    = { a = "randint(2, 9)", b = "randint(2, 9)" }
  text    = "{a} × ? = {a * b}"
  answer  = "b"
  hint    = "Count by {a}s until you reach {a * b}."
  explain = "{a} × {answer} = {a * b}."

  [[topic.question]]
  levels  = [3, 4, 5]
  vars    = { a = "randint(3, 9)", b = "randint(3, 9)", who = "name()" }
  text    = "{who} buys {a} packs of stickers with {b} in each pack. How many stickers?"
  answer  = "a * b"
  hint    = "{a} groups of {b}."
  explain = "{a} × {b} = {answer} stickers."

  [[topic.question]]
  levels  = [3, 4, 5]
  vars    = { a = "randint(2, 9)" }
  text    = "Count by {a}s: {a}, {2 * a}, {3 * a}, ?"
  answer  = "4 * a"
  hint    = "Add {a} to {3 * a}."
  explain = "{3 * a} + {a} = {answer}, which is 4 × {a}."

  [[topic.question]]
  levels  = [4, 5]
  vars    = { a = "randint(3, 9)", b = "randint(4, 9)", c = "randint(1, b - 1)" }
  text    = "{a} × {b} = {a} × {c} + {a} × ?"
  answer  = "b - c"
  hint    = "Break {b} into {c} and something else."
  explain = "{b} = {c} + {answer}, so {a} × {b} = {a} × {c} + {a} × {answer}."

  [[topic.question]]
  levels  = [4, 5]
  vars    = { a = "randint(2, 5)", b = "randint(2, 5)", c = "randint(2, 5)" }
  text    = "{a} × {b} × {c} = ?"
  answer  = "a * b * c"
  hint    = "Multiply two numbers first: {a} × {b} = {a * b}. Then multiply by {c}."
  explain = "{a} × {b} = {a * b}, and {a * b} × {c} = {answer}."

[[topic]]
id       = "g3_mult10"
label    = "Multiplying by tens"
standard = "3.NBT.A.3"
tip      = "6 × 70: do 6 × 7 = 42, then put a zero on the end: 420."

  [[topic.question]]
  vars    = { a = "randint(2, [5, 9, 9, 9, 9][L - 1])", b = "randstep(10, [50, 90, 90, 90, 90][L - 1], 10)" }
  text    = "{a} × {b} = ?"
  answer  = "a * b"
  hint    = "{a} × {b // 10} = {a * (b // 10)}. Now put a zero on the end."
  explain = "{a} × {b // 10} tens = {a * (b // 10)} tens = {answer}."

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  vars    = { a = "randint(2, 9)", b = "randstep(10, 90, 10)" }
  text    = "{b} × {a} = ?"
  answer  = "a * b"
  hint    = "{b // 10} × {a} = {a * (b // 10)}, then add the zero."
  explain = "{b} × {a} = {answer}."

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  vars    = { a = "randint(2, 9)", b = "randstep(10, 90, 10)", what = "choice(['nails', 'beads', 'seeds', 'paper clips'])" }
  text    = "{a} boxes with {b} {what} in each. How many {what}?"
  answer  = "a * b"
  hint    = "{a} groups of {b}."
  explain = "{a} × {b} = {answer} {what}."

  [[topic.question]]
  levels  = [3, 4, 5]
  vars    = { a = "randint(2, 9)", b = "randstep(10, 90, 10)" }
  text    = "{a} × ? = {a * b}"
  answer  = "b"
  hint    = "{a} × ? = {a * (b // 10)} tens."
  explain = "{a} × {answer} = {a * b}."

  [[topic.question]]
  levels  = [4, 5]
  vars    = { a = "randint(2, 9)", b = "randint(2, 9)" }
  text    = "{a} × {b} × 10 = ?"
  answer  = "a * b * 10"
  hint    = "{a} × {b} = {a * b}. Then times 10."
  explain = "{a * b} × 10 = {answer}."

[[topic]]
id       = "g3_div"
label    = "Division"
standard = "3.OA.A.2"
tip      = "Think multiplication: 24 ÷ 6 asks 6 × ? = 24."

  [[topic.question]]
  levels  = [1, 2]
  vars    = { d = "randint(2, 5)", q = "randint(1, [5, 9][L - 1])" }
  text    = "{d * q} ÷ {d} = ?"
  answer  = "q"
  hint    = "The dots are in {d} rows. How many in each row?"
  explain = "{d} × {q} = {d * q}, so {d * q} ÷ {d} = {answer}."
  picture = ["array", "d", "q"]

  [[topic.question]]
  levels  = [3, 4, 5]
  vars    = { d = "randint(2, [9, 10, 12][L - 3])", q = "randint(2, [9, 10, 12][L - 3])" }
  text    = "{d * q} ÷ {d} = ?"
  answer  = "q"
  hint    = "{d} × ? = {d * q}"
  explain = "{d} × {answer} = {d * q}, so {d * q} ÷ {d} = {answer}."

  [[topic.question]]
  vars    = { d = "randint(2, [4, 5, 9, 9, 9][L - 1])", q = "randint(2, [5, 9, 9, 10, 12][L - 1])", what = "item()" }
  text    = "{d * q} {what} are shared equally by {d} kids. How many does each get?"
  answer  = "q"
  hint    = "{d} × ? = {d * q}"
  explain = "{d * q} ÷ {d} = {answer} each."

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  vars    = { d = "randint(2, 9)", q = "randint(2, 9)" }
  text    = "How many groups of {d} are in {d * q}?"
  answer  = "q"
  hint    = "Count by {d}s up to {d * q}."
  explain = "{d} × {answer} = {d * q}, so there are {answer} groups."

  [[topic.question]]
  levels  = [3, 4, 5]
  vars    = { d = "randint(2, 9)", q = "randint(2, 9)" }
  text    = "? ÷ {d} = {q}"
  answer  = "d * q"
  hint    = "Multiply: {d} × {q}."
  explain = "{d} × {q} = {answer}, so {answer} ÷ {d} = {q}."

  [[topic.question]]
  levels  = [3, 4, 5]
  vars    = { d = "randint(2, 9)", q = "randint(2, 9)" }
  text    = "{d * q} ÷ ? = {q}"
  answer  = "d"
  hint    = "? × {q} = {d * q}"
  explain = "{d * q} ÷ {answer} = {q}."

  [[topic.question]]
  levels  = [4, 5]
  vars    = { d = "randint(3, 9)", q = "randint(3, 12)", who = "name()" }
  text    = "{who} has {d * q} flowers and puts {d} in each vase. How many vases?"
  answer  = "q"
  hint    = "How many groups of {d} in {d * q}?"
  explain = "{d * q} ÷ {d} = {answer} vases."

[[topic]]
id       = "g3_graphs"
label    = "Scaled bar graphs"
standard = "3.MD.B.3"
tip      = "Check the scale: each line may stand for 2, 5 or 10. Read the top of each bar against the scale."

  [[topic.question]]
  vars    = { s = "choice([2, 5, 10][:L])", labels = "sample(['Mon', 'Tue', 'Wed', 'Thu', 'Fri'], 3)", cs = "[s * randint(1, 8), s * randint(1, 8), s * randint(1, 8)]" }
  where   = "different(cs)"
  text    = "Fish caught each day. How many on {labels[0]}?"
  answer  = "cs[0]"
  hint    = "Each line on the scale is {s}."
  explain = "The {labels[0]} bar reaches {answer}."
  picture = ["bar_graph", "labels", "cs", "s"]

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  vars    = { s = "choice([2, 5, 10])", labels = "sample(['Mon', 'Tue', 'Wed', 'Thu', 'Fri'], 3)", cs = "[s * randint(1, 8), s * randint(1, 8), s * randint(1, 8)]" }
  where   = "cs[0] > cs[1]"
  text    = "Fish caught each day. How many more on {labels[0]} than on {labels[1]}?"
  answer  = "cs[0] - cs[1]"
  hint    = "Read both bars, then subtract."
  explain = "{cs[0]} − {cs[1]} = {answer} more."
  picture = ["bar_graph", "labels", "cs", "s"]

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  vars    = { s = "choice([2, 5, 10])", labels = "sample(['Mon', 'Tue', 'Wed', 'Thu', 'Fri'], 3)", cs = "[s * randint(1, 8), s * randint(1, 8), s * randint(1, 8)]" }
  text    = "Fish caught each day. How many fish in all three days?"
  answer  = "sum(cs)"
  hint    = "Read all three bars and add."
  explain = "{join(cs, ' + ')} = {answer}."
  picture = ["bar_graph", "labels", "cs", "s"]

  [[topic.question]]
  levels  = [3, 4, 5]
  vars    = { e = "choice([2, 5, 10])", labels = "sample(['cod', 'tuna', 'crab', 'eel'], 2)", a = "e * randint(1, 8)", b = "e * randint(1, 8)" }
  where   = "a != b"
  text    = "Each star stands for {e} fish. How many {labels[0]}?"
  answer  = "a"
  hint    = "Count the stars and multiply by {e}."
  explain = "{a // e} stars × {e} = {answer}."
  picture = ["picture_graph", "labels", "[a, b]", "e"]

  [[topic.question]]
  levels  = [3, 4, 5]
  kind    = "choice"
  vars    = { s = "choice([2, 5, 10])", labels = "sample(['Mon', 'Tue', 'Wed', 'Thu', 'Fri'], 3)", cs = "[s * randint(1, 8), s * randint(1, 8), s * randint(1, 8)]" }
  where   = "different(cs)"
  text    = "On which day were the most fish caught?"
  answer  = "labels[index(cs, max(cs))]"
  choices = ["labels[0]", "labels[1]", "labels[2]"]
  shuffle = false
  hint    = "The tallest bar."
  explain = "{answer} has the tallest bar: {max(cs)} fish."
  picture = ["bar_graph", "labels", "cs", "s"]

  [[topic.question]]
  levels  = [4, 5]
  vars    = { s = "choice([2, 5, 10])", labels = "sample(['Mon', 'Tue', 'Wed', 'Thu', 'Fri'], 3)", cs = "[s * randint(4, 9), s * randint(1, 3), s * randint(1, 3)]" }
  where   = "cs[0] > cs[1] + cs[2]"
  text    = "How many more fish on {labels[0]} than on {labels[1]} and {labels[2]} together?"
  answer  = "cs[0] - cs[1] - cs[2]"
  hint    = "Add {labels[1]} and {labels[2]} first."
  explain = "{cs[1]} + {cs[2]} = {cs[1] + cs[2]}, and {cs[0]} − {cs[1] + cs[2]} = {answer}."
  picture = ["bar_graph", "labels", "cs", "s"]

[[topic]]
id       = "g3_fractions"
label    = "Fractions"
standard = "3.NF.A.1"
tip      = "The bottom number says how many equal parts make one whole. The top says how many of them you have."

  [[topic.question]]
  kind    = "fraction"
  vars    = { d = "choice([2, 3, 4] if L == 1 else [2, 3, 4, 6, 8])", k = "randint(1, d - 1)" }
  text    = "A pie is cut into {d} equal slices. {k} {'slice is' if k == 1 else 'slices are'} eaten. What fraction of the pie is eaten?"
  answer  = "k / d"
  hint    = "Top: slices eaten. Bottom: slices in the whole pie."
  explain = "{k} out of {d} slices is {k}/{d}."
  picture = ["pie", "k", "d"]

  [[topic.question]]
  kind    = "fraction"
  vars    = { d = "choice([2, 3, 4] if L == 1 else [2, 3, 4, 6, 8])", k = "randint(1, d - 1)" }
  text    = "What fraction of the bar is colored?"
  answer  = "k / d"
  hint    = "Count the colored parts and all the parts."
  explain = "{k} of {d} equal parts: {k}/{d}."
  picture = ["parts", "d", "k"]

  [[topic.question]]
  levels  = [2, 3, 4, 5]
  kind    = "fraction"
  vars    = { d = "choice([2, 4] if L == 2 else [2, 3, 4, 6, 8])", k = "randint(1, d - 1)" }
  text    = "The line from 0 to 1 is cut into equal parts. What fraction is at the point?"
  answer  = "k / d"
  hint    = "Count the parts between 0 and 1: that is the bottom number. Count the parts up to the point: the top."
  explain = "{d} parts make 1, and the point is {k} parts along: {k}/{d}."
  picture = ["number_line", "0", "1", "k / d", "d"]

  [[topic.question]]
  levels  = [3, 4, 5]
  kind    = "fraction"
  vars    = { d = "choice([2, 3, 4])", hi = "choice([2, 3])", k = "randint(d + 1, d * hi - 1)" }
  where   = "k % d != 0"
  text    = "The line is cut into {'halves' if d == 2 else 'thirds' if d == 3 else 'fourths'}. What fraction is at the point?"
  answer  = "k / d"
  hint    = "Count all the small parts from 0 to the point. The bottom number is {d}."
  explain = "The point is {k} parts of size 1/{d}: {k}/{d}, which is {answer}."
  picture = ["number_line", "0", "hi", "k / d", "d"]

